name: CI

# Pull requests are checked on their own event; pushes are checked only on main (merges), so a
# branch with an open PR is not tested twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the running checks obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (JUnit + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # GitHub's Ubuntu runners have Docker, which Testcontainers uses to start PostgreSQL 16.
      - name: Test and measure coverage
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: always() && hashFiles('backend/target/site/jacoco/jacoco.csv') != ''
        run: python3 ../.github/scripts/jacoco_summary.py target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright, Docker Compose stack)
    needs: [backend, frontend]
    # Pinned, not ubuntu-latest: Playwright only installs its browsers and their system libraries on
    # Ubuntu releases it supports, and ubuntu-latest moved to 26.04, which Playwright 1.56 rejects.
    # Move this forward together with a Playwright upgrade (keep e2e/package.json in step).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:4200
        run: npx playwright test

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down -v
